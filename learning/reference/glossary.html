<script src="../assets/glossary-data.js"></script>
<script>
/* Render every glossary entry from the single shared data file.
   One source of truth: lessons and this page read the same object. */
(function () {
  var G = window.GLOSSARY || {};
  var keys = Object.keys(G).sort(function (a, b) {
    return G[a].term.toLowerCase().localeCompare(G[b].term.toLowerCase());
  });

  var body = document.getElementById("gl-body");
  var jump = document.getElementById("gl-jump");

  keys.forEach(function (k) {
    var e = G[k];

    var a = document.createElement("a");
    a.href = "#" + k;
    a.textContent = e.term;
    jump.appendChild(a);

    var div = document.createElement("div");
    div.className = "gl-entry";
    div.id = k;

    var h = document.createElement("h3");
    h.textContent = e.term;

    var en = document.createElement("div");
    en.className = "gl-en";
    en.textContent = e.en;

    var def = document.createElement("p");
    def.innerHTML = e.def;

    div.appendChild(h);
    div.appendChild(en);
    div.appendChild(def);
    body.appendChild(div);
  });
})();
</script>
